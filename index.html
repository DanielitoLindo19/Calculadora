<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾 Control de Ventas - Peluditos 🐾</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; }
    </style>
</head>
<body class="bg-pink-100 min-h-screen p-3 sm:p-4 text-gray-800 pb-16">

    <div class="max-w-md mx-auto">
        <!-- Encabezado Rosa -->
        <header class="text-center mb-5 bg-pink-500 text-white p-4 rounded-3xl shadow-md border-2 border-pink-300">
            <h1 class="text-2xl font-bold">🐾 Control de Ventas 🐾</h1>
            <p class="text-xs text-pink-100 mt-1">Alimentos, Accesorios y Juguetes</p>
        </header>

        <!-- Tarjeta de Tasa del Dólar -->
        <div class="bg-white rounded-3xl shadow-md p-4 mb-4 border-2 border-pink-300">
            <label class="block text-sm font-bold text-pink-700 mb-1">💱 Tasa del Dólar Hoy (Bs/$):</label>
            <div class="flex gap-2">
                <input type="number" id="tasaDolar" step="0.01" placeholder="Ej: 36.50" 
                    class="w-full px-3 py-2 border-2 border-pink-200 rounded-2xl focus:outline-none focus:border-pink-500 font-bold text-lg text-pink-600 bg-pink-50/50"
                    oninput="actualizarTasa()">
                <button onclick="guardarTasa()" class="bg-pink-500 hover:bg-pink-600 text-white px-4 py-2 rounded-2xl font-bold transition shadow-sm">Guardar</button>
            </div>
        </div>

        <!-- Sección de Armar Ticket / Carrito -->
        <div class="bg-white rounded-3xl shadow-md p-4 mb-4 border-2 border-pink-300">
            <h2 class="text-lg font-bold text-pink-700 mb-3 flex items-center gap-2">
                <span>🛒</span> Registrar Compra
            </h2>
            
            <div class="mb-3">
                <label class="block text-sm font-semibold text-gray-600 mb-1">Seleccionar Producto:</label>
                <select id="productoSelect" onchange="actualizarUnidadMedida()" class="w-full px-3 py-2 border-2 border-pink-200 rounded-2xl focus:outline-none focus:border-pink-500 bg-pink-50/50 text-gray-700 font-semibold">
                    <option value="">-- Elige un producto --</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-600 mb-1" id="labelCantidad">Cantidad (kg / unidades):</label>
                <div class="flex gap-2">
                    <input type="number" id="cantidadInput" step="0.1" min="0" placeholder="Ej: 1.5 o 2" 
                        class="w-full px-3 py-2 border-2 border-pink-200 rounded-2xl focus:outline-none focus:border-pink-500 text-lg font-bold text-pink-600 bg-pink-50/50">
                    <button onclick="agregarAlCarrito()" class="bg-pink-600 hover:bg-pink-700 text-white px-4 py-2 rounded-2xl font-bold transition whitespace-nowrap shadow-sm">
                        + Añadir
                    </button>
                </div>
            </div>

            <!-- Lista de Productos en el Carrito Actual -->
            <div class="border-t-2 border-pink-100 pt-3 mb-3">
                <h3 class="text-xs font-bold text-pink-400 uppercase tracking-wider mb-2">Productos en esta venta:</h3>
                <div id="carritoLista" class="space-y-2 max-h-44 overflow-y-auto pr-1">
                    <p class="text-sm text-gray-400 italic text-center py-2">No hay productos agregados aún</p>
                </div>
            </div>

            <!-- Totales del Ticket -->
            <div class="bg-pink-50 rounded-2xl p-4 mb-4 border-2 border-pink-200">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-gray-600 font-semibold">Total a Pagar (Bs):</span>
                    <span id="totalTicketBs" class="text-xl font-bold text-purple-600">Bs. 0,00</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-600 font-semibold">Total a Pagar (USD):</span>
                    <span id="totalTicketUSD" class="text-xl font-bold text-pink-600">$0.00</span>
                </div>
            </div>

            <!-- Cálculo de Vuelto -->
            <div class="border-t-2 border-pink-100 pt-3">
                <label class="block text-sm font-semibold text-gray-600 mb-1">¿Con cuánto paga el cliente?</label>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <input type="number" id="pagoMonto" placeholder="Monto recibido" step="0.01" 
                        class="w-full px-3 py-2 border-2 border-pink-200 rounded-2xl focus:outline-none focus:border-pink-500 bg-pink-50/50"
                        oninput="calcularVuelto()">
                    <select id="pagoMoneda" onchange="calcularVuelto()" class="w-full px-3 py-2 border-2 border-pink-200 rounded-2xl bg-pink-50/50 font-semibold text-gray-700">
                        <option value="Bs">Bolívares (Bs)</option>
                        <option value="USD">Dólares ($)</option>
                    </select>
                </div>
                
                <div class="flex justify-between items-center bg-green-50 rounded-2xl p-3 border-2 border-green-200">
                    <div>
                        <span class="text-xs font-bold text-green-700 block">VUELTO A ENTREGAR:</span>
                        <span id="vueltoResultado" class="text-base font-bold text-green-800">--</span>
                    </div>
                    <button onclick="finalizarVenta()" class="bg-green-600 hover:bg-green-700 text-white text-xs px-3 py-2 rounded-xl font-bold transition shadow-sm">
                        Completar Venta
                    </button>
                </div>
            </div>
        </div>

        <!-- Sección de Gestión de Inventario (Alimentos y Accesorios con foto/emoji) -->
        <div class="bg-white rounded-3xl shadow-md p-4 border-2 border-pink-300">
            <h2 class="text-lg font-bold text-pink-700 mb-3 flex items-center gap-2">
                <span>📦</span> Administrar Inventario
            </h2>
            
            <div class="space-y-3 mb-4">
                <input type="text" id="nuevoNombre" placeholder="Nombre (Ej: Collar / Perrarina)" 
                    class="w-full px-3 py-2 border-2 border-pink-200 rounded-2xl focus:outline-none focus:border-pink-500 text-sm bg-pink-50/50">
                
                <div class="grid grid-cols-2 gap-2">
                    <select id="nuevoTipo" class="w-full px-3 py-2 border-2 border-pink-200 rounded-2xl bg-pink-50/50 text-sm font-semibold text-gray-700">
                        <option value="kg">Por Kilos (Granel)</option>
                        <option value="unidad">Por Unidad (Pieza)</option>
                    </select>
                    <input type="number" id="nuevoPrecioBs" step="0.01" placeholder="Precio en Bs" 
                        class="w-full px-3 py-2 border-2 border-pink-200 rounded-2xl focus:outline-none focus:border-pink-500 text-sm bg-pink-50/50">
                </div>

                <input type="text" id="nuevoImagen" placeholder="URL de Imagen o Emoji (Ej: 🐶 o https://...)" 
                    class="w-full px-3 py-2 border-2 border-pink-200 rounded-2xl focus:outline-none focus:border-pink-500 text-xs bg-pink-50/50">
                
                <button onclick="agregarProductoInventario()" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-2.5 rounded-2xl transition shadow-sm cursor-pointer">
                    + Agregar al Inventario
                </button>
            </div>

            <div class="border-t-2 border-pink-100 pt-3">
                <h3 class="text-xs font-bold text-pink-400 uppercase tracking-wider mb-2">Inventario Registrado:</h3>
                <div id="listaInventario" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                    <!-- Se llenan con JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let tasa = parseFloat(localStorage.getItem('tasaDolar')) || 0;
        
        let productos = JSON.parse(localStorage.getItem('productos')) || [
            { id: 1, nombre: '🐶 Perrarina Adulto', tipo: 'kg', precioBs: 90.00, img: '' },
            { id: 2, nombre: '🐱 Gatarina Gato Adulto', tipo: 'kg', precioBs: 110.00, img: '' },
            { id: 3, nombre: '🦴 Collar Ajustable Perro', tipo: 'unidad', precioBs: 180.00, img: '' },
            { id: 4, nombre: '🎾 Pelota Juguete', tipo: 'unidad', precioBs: 130.00, img: '' }
        ];

        let carrito = [];

        document.getElementById('tasaDolar').value = tasa > 0 ? tasa : '';
        renderizarInventario();
        actualizarSelectProductos();

        function guardarTasa() {
            let val = parseFloat(document.getElementById('tasaDolar').value);
            if (!val || val <= 0) {
                alert('Por favor ingresa una tasa válida.');
                return;
            }
            tasa = val;
            localStorage.setItem('tasaDolar', tasa);
            alert('¡Tasa guardada con éxito!');
            calcularTotalesCarrito();
        }

        function actualizarTasa() {
            tasa = parseFloat(document.getElementById('tasaDolar').value) || 0;
            localStorage.setItem('tasaDolar', tasa);
            calcularTotalesCarrito();
        }

        function agregarProductoInventario() {
            let nombre = document.getElementById('nuevoNombre').value.trim();
            let tipo = document.getElementById('nuevoTipo').value;
            let precioBs = parseFloat(document.getElementById('nuevoPrecioBs').value);
            let img = document.getElementById('nuevoImagen').value.trim();

            if (!nombre || isNaN(precioBs) || precioBs <= 0) {
                alert('Escribe un nombre y un precio válido en bolívares.');
                return;
            }

            productos.push({ id: Date.now(), nombre, tipo, precioBs, img });
            localStorage.setItem('productos', JSON.stringify(productos));

            document.getElementById('nuevoNombre').value = '';
            document.getElementById('nuevoPrecioBs').value = '';
            document.getElementById('nuevoImagen').value = '';

            renderizarInventario();
            actualizarSelectProductos();
            alert('¡Producto agregado al inventario!');
        }

        function eliminarProductoInventario(id) {
            productos = productos.filter(p => p.id !== id);
            localStorage.setItem('productos', JSON.stringify(productos));
            renderizarInventario();
            actualizarSelectProductos();
        }

        function renderizarInventario() {
            let lista = document.getElementById('listaInventario');
            lista.innerHTML = '';

            productos.forEach(p => {
                let item = document.createElement('div');
                item.className = 'flex justify-between items-center bg-pink-50 p-2.5 rounded-2xl text-sm border-2 border-pink-200';
                
                let unidadTexto = p.tipo === 'kg' ? 'por kilo' : 'por unidad';
                
                item.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="text-xl">🐾</span>
                        <div>
                            <span class="font-bold text-gray-700 block">${p.nombre}</span>
                            <span class="text-xs text-pink-600 font-semibold">Bs. ${p.precioBs.toFixed(2)} (${unidadTexto})</span>
                        </div>
                    </div>
                    <button type="button" onclick="eliminarProductoInventario(${p.id})" class="text-red-400 hover:text-red-600 font-bold px-2 py-1 text-xs cursor-pointer">🗑️</button>
                `;
                lista.appendChild(item);
            });
        }

        function actualizarSelectProductos() {
            let select = document.getElementById('productoSelect');
            select.innerHTML = '<option value="">-- Elige un producto --</option>';

            productos.forEach(p => {
                let opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `${p.nombre} - Bs. ${p.precioBs.toFixed(2)}`;
                select.appendChild(opt);
            });
            actualizarUnidadMedida();
        }

        function actualizarUnidadMedida() {
            let productoId = document.getElementById('productoSelect').value;
            let label = document.getElementById('labelCantidad');
            let prod = productos.find(p => p.id == productoId);

            if (!prod) {
                label.textContent = 'Cantidad (kg / unidades):';
                return;
            }

            if (prod.tipo === 'kg') {
                label.textContent = 'Cantidad en Kilos (kg):';
            } else {
                label.textContent = 'Cantidad en Unidades (Piezas):';
            }
        }

        function agregarAlCarrito() {
            let productoId = document.getElementById('productoSelect').value;
            let cantidad = parseFloat(document.getElementById('cantidadInput').value);

            let prod = productos.find(p => p.id == productoId);
            if (!prod || isNaN(cantidad) || cantidad <= 0) {
                alert('Selecciona un producto y escribe una cantidad mayor a 0.');
                return;
            }

            let subtotalBs = prod.precioBs * cantidad;
            carrito.push({
                cartId: Date.now(),
                id: prod.id,
                nombre: prod.nombre,
                tipo: prod.tipo,
                precioBs: prod.precioBs,
                cantidad: cantidad,
                subtotalBs: subtotalBs
            });

            document.getElementById('cantidadInput').value = '';
            renderizarCarrito();
        }

        function eliminarDelCarrito(cartId) {
            carrito = carrito.filter(item => item.cartId !== cartId);
            renderizarCarrito();
        }

        function renderizarCarrito() {
            let lista = document.getElementById('carritoLista');
            lista.innerHTML = '';

            if (carrito.length === 0) {
                lista.innerHTML = '<p class="text-sm text-gray-400 italic text-center py-2">No hay productos agregados aún</p>';
                calcularTotalesCarrito();
                return;
            }

            carrito.forEach(item => {
                let div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-pink-50/80 p-2.5 rounded-2xl text-sm border-2 border-pink-200';
                
                let unidadLabel = item.tipo === 'kg' ? 'kg' : 'und';

                div.innerHTML = `
                    <div>
                        <span class="font-bold text-gray-800 block">${item.nombre}</span>
                        <span class="text-xs text-gray-500">${item.cantidad} ${unidadLabel} × Bs. ${item.precioBs.toFixed(2)} = <b class="text-pink-600">Bs. ${item.subtotalBs.toFixed(2)}</b></span>
                    </div>
                    <button onclick="eliminarDelCarrito(${item.cartId})" class="text-red-400 hover:text-red-600 font-bold px-2 py-1 text-xs">❌</button>
                `;
                lista.appendChild(div);
            });

            calcularTotalesCarrito();
        }

        function calcularTotalesCarrito() {
            let totalBs = carrito.reduce((sum, item) => sum + item.subtotalBs, 0);
            let totalUSD = tasa > 0 ? totalBs / tasa : 0;

            document.getElementById('totalTicketBs').textContent = `Bs. ${totalBs.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('totalTicketUSD').textContent = `$${totalUSD.toFixed(2)}`;

            calcularVuelto();
        }

        function calcularVuelto() {
            let totalBs = carrito.reduce((sum, item) => sum + item.subtotalBs, 0);
            let pagoMonto = parseFloat(document.getElementById('pagoMonto').value) || 0;
            let pagoMoneda = document.getElementById('pagoMoneda').value;

            if (totalBs === 0 || pagoMonto <= 0) {
                document.getElementById('vueltoResultado').textContent = '--';
                return;
            }

            let vueltoText = '';

            if (pagoMoneda === 'Bs') {
                let cambioBs = pagoMonto - totalBs;
                if (cambioBs < 0) {
                    vueltoText = '⚠️ El pago es menor al total';
                } else {
                    let cambioUSD = tasa > 0 ? cambioBs / tasa : 0;
                    vueltoText = `Bs. ${cambioBs.toFixed(2)} ($${cambioUSD.toFixed(2)})`;
                }
            } else {
                if (tasa <= 0) {
                    vueltoText = '⚠️ Configure la tasa del dólar';
                } else {
                    let pagoBsCalculado = pagoMonto * tasa;
                    let cambioBs = pagoBsCalculado - totalBs;
                    if (cambioBs < 0) {
                        vueltoText = '⚠️ El pago en USD es menor al total';
                    } else {
                        let cambioUSD = cambioBs / tasa;
                        vueltoText = `$${cambioUSD.toFixed(2)} (Bs. ${cambioBs.toFixed(2)})`;
                    }
                }
            }

            document.getElementById('vueltoResultado').textContent = vueltoText;
        }

        function finalizarVenta() {
            if (carrito.length === 0) {
                alert('Agrega al menos un producto al carrito para completar la venta.');
                return;
            }
            alert('¡Venta registrada con éxito! 🐾');
            carrito = [];
            document.getElementById('pagoMonto').value = '';
            renderizarCarrito();
        }
    </script>
</body>
</html>

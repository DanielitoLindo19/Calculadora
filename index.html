<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Alimentos - Peluditos</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Quicksand', sans-serif; }
    </style>
</head>
<body class="bg-pink-50 min-h-screen p-4 text-gray-800 pb-12">

    <div class="max-w-md mx-auto p-4 sm:p-6">
        <!-- Encabezado -->
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-pink-600">🐾 Control de Ventas 🐾</h1>
            <p class="text-sm text-gray-500">Alimentos a Granel</p>
        </header>

        <!-- Tarjeta de Tasa del Dólar -->
        <div class="bg-white rounded-2xl shadow-md p-4 mb-5 border-2 border-pink-200">
            <label class="block text-sm font-bold text-pink-700 mb-1">💱 Tasa del Dólar Hoy (Bs/$):</label>
            <div class="flex gap-2">
                <input type="number" id="tasaDolar" step="0.01" placeholder="Ej: 36.50" 
                    class="w-full px-3 py-2 border border-pink-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 font-bold text-lg text-pink-600"
                    oninput="actualizarTasa()">
                <button onclick="guardarTasa()" class="bg-pink-500 hover:bg-pink-600 text-white px-4 py-2 rounded-xl font-bold transition">Guardar</button>
            </div>
        </div>

        <!-- Sección de Calculadora / Venta -->
        <div class="bg-white rounded-2xl shadow-md p-5 mb-5 border-2 border-pink-200">
            <h2 class="text-lg font-bold text-pink-700 mb-3">🛒 Realizar Venta</h2>
            
            <div class="mb-3">
                <label class="block text-sm font-semibold text-gray-600 mb-1">Seleccionar Producto:</label>
                <select id="productoSelect" onchange="calcularVenta()" class="w-full px-3 py-2 border border-pink-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 bg-white">
                    <option value="">-- Elige un alimento --</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-600 mb-1">Cantidad en Kilos (kg):</label>
                <input type="number" id="kilosInput" step="0.1" min="0" placeholder="Ej: 1.5 o 2" 
                    class="w-full px-3 py-2 border border-pink-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 text-lg font-bold"
                    oninput="calcularVenta()">
            </div>

            <!-- Resultado de la Venta -->
            <div class="bg-pink-50 rounded-xl p-4 mb-4 border border-pink-200">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-gray-600 font-semibold">Total en Bolívares:</span>
                    <span id="totalBs" class="text-xl font-bold text-purple-600">Bs. 0,00</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-600 font-semibold">Total en Dólares:</span>
                    <span id="totalUSD" class="text-xl font-bold text-pink-600">$0.00</span>
                </div>
            </div>

            <!-- Cálculo de Vuelto -->
            <div class="border-t border-pink-100 pt-3">
                <label class="block text-sm font-semibold text-gray-600 mb-1">¿Con cuánto paga el cliente?</label>
                <div class="grid grid-cols-2 gap-2 mb-3">
                    <input type="number" id="pagoMonto" placeholder="Monto recibido" step="0.01" 
                        class="w-full px-3 py-2 border border-pink-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400"
                        oninput="calcularVuelto()">
                    <select id="pagoMoneda" onchange="calcularVuelto()" class="w-full px-3 py-2 border border-pink-300 rounded-xl bg-white">
                        <option value="Bs">Bolívares (Bs)</option>
                        <option value="USD">Dólares ($)</option>
                    </select>
                </div>
                
                <div class="bg-green-50 rounded-xl p-3 border border-green-200 text-center">
                    <span class="text-sm font-bold text-green-700 block">VUELTO A ENTREGAR:</span>
                    <span id="vueltoResultado" class="text-lg font-bold text-green-800">--</span>
                </div>
            </div>
        </div>

        <!-- Sección de Gestión de Productos -->
        <div class="bg-white rounded-2xl shadow-md p-5 border-2 border-pink-200">
            <h2 class="text-lg font-bold text-pink-700 mb-3">📦 Administrar Productos</h2>
            
            <div class="space-y-3 mb-4">
                <input type="text" id="nuevoNombre" placeholder="Nombre del alimento (Ej: Perrarina Adulto)" 
                    class="w-full px-3 py-2 border border-pink-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm">
                <input type="number" id="nuevoPrecioBs" step="0.01" placeholder="Precio por Kilo en Bolívares (Bs)" 
                    class="w-full px-3 py-2 border border-pink-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm">
                
                <button id="btnAgregar" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-2.5 rounded-xl transition shadow-sm cursor-pointer">
                    + Agregar Producto
                </button>
            </div>

            <div class="border-t border-pink-100 pt-3">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Productos Guardados:</h3>
                <div id="listaProductos" class="space-y-2 max-h-40 overflow-y-auto pr-1">
                    <!-- Se llenan con JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        let tasa = parseFloat(localStorage.getItem('tasaDolar')) || 0;
        let productos = JSON.parse(localStorage.getItem('productos')) || [
            { id: 1, nombre: 'Perrarina Perro Adulto', precioBs: 90.00 },
            { id: 2, nombre: 'Gatarina Gato Adulto', precioBs: 110.00 }
        ];

        document.getElementById('tasaDolar').value = tasa > 0 ? tasa : '';
        renderizarProductos();

        document.getElementById('btnAgregar').addEventListener('click', function() {
            let nombreInput = document.getElementById('nuevoNombre');
            let precioBsInput = document.getElementById('nuevoPrecioBs');
            
            let nombre = nombreInput.value.trim();
            let precioBs = parseFloat(precioBsInput.value);

            if (!nombre || isNaN(precioBs) || precioBs <= 0) {
                alert('Por favor escribe un nombre y un precio válido en bolívares.');
                return;
            }

            productos.push({ id: Date.now(), nombre, precioBs });
            localStorage.setItem('productos', JSON.stringify(productos));
            
            nombreInput.value = '';
            precioBsInput.value = '';
            
            renderizarProductos();
            calcularVenta();
        });

        function guardarTasa() {
            let val = parseFloat(document.getElementById('tasaDolar').value);
            if (!val || val <= 0) {
                alert('Por favor ingresa una tasa válida.');
                return;
            }
            tasa = val;
            localStorage.setItem('tasaDolar', tasa);
            alert('¡Tasa guardada con éxito!');
            calcularVenta();
        }

        function actualizarTasa() {
            tasa = parseFloat(document.getElementById('tasaDolar').value) || 0;
            localStorage.setItem('tasaDolar', tasa);
            calcularVenta();
        }

        function eliminarProducto(id) {
            productos = productos.filter(p => p.id !== id);
            localStorage.setItem('productos', JSON.stringify(productos));
            renderizarProductos();
            calcularVenta();
        }

        function renderizarProductos() {
            let select = document.getElementById('productoSelect');
            let lista = document.getElementById('listaProductos');
            
            let productoActual = select.value; 

            select.innerHTML = '<option value="">-- Elige un alimento --</option>';
            lista.innerHTML = '';

            productos.forEach(p => {
                let opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = `${p.nombre} (Bs. ${p.precioBs.toFixed(2)}/kg)`;
                select.appendChild(opt);

                let item = document.createElement('div');
                item.className = 'flex justify-between items-center bg-pink-50 p-2 rounded-lg text-sm border border-pink-100';
                item.innerHTML = `
                    <span class="font-medium text-gray-700">${p.nombre} <b class="text-purple-600">(Bs. ${p.precioBs.toFixed(2)}/kg)</b></span>
                    <button type="button" onclick="eliminarProducto(${p.id})" class="text-red-500 hover:text-red-700 font-bold px-2 py-1 text-xs cursor-pointer">🗑️ Borrar</button>
                `;
                lista.appendChild(item);
            });

            if (productoActual) {
                select.value = productoActual;
            }
        }

        function calcularVenta() {
            let productoId = document.getElementById('productoSelect').value;
            let kilos = parseFloat(document.getElementById('kilosInput').value) || 0;

            let prod = productos.find(p => p.id == productoId);

            if (!prod || kilos <= 0) {
                document.getElementById('totalBs').textContent = 'Bs. 0,00';
                document.getElementById('totalUSD').textContent = '$0.00';
                document.getElementById('vueltoResultado').textContent = '--';
                return;
            }

            let totalBs = prod.precioBs * kilos;
            let totalUSD = tasa > 0 ? totalBs / tasa : 0;

            document.getElementById('totalBs').textContent = `Bs. ${totalBs.toLocaleString('es-VE', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            document.getElementById('totalUSD').textContent = `$${totalUSD.toFixed(2)}`;

            calcularVuelto();
        }

        function calcularVuelto() {
            let productoId = document.getElementById('productoSelect').value;
            let kilos = parseFloat(document.getElementById('kilosInput').value) || 0;
            let pagoMonto = parseFloat(document.getElementById('pagoMonto').value) || 0;
            let pagoMoneda = document.getElementById('pagoMoneda').value;

            let prod = productos.find(p => p.id == productoId);
            if (!prod || kilos <= 0 || pagoMonto <= 0) {
                document.getElementById('vueltoResultado').textContent = '--';
                return;
            }

            let totalBs = prod.precioBs * kilos;
            let vueltoText = '';

            if (pagoMoneda === 'Bs') {
                let cambioBs = pagoMonto - totalBs;
                if (cambioBs < 0) {
                    vueltoText = '⚠️ El pago es menor al total';
                } else {
                    let cambioUSD = tasa > 0 ? cambioBs / tasa : 0;
                    vueltoText = `Bs. ${cambioBs.toFixed(2)} (Equivale a $${cambioUSD.toFixed(2)})`;
                }
            } else {
                if (tasa <= 0) {
                    vueltoText = '⚠️ Debe configurar la tasa del dólar primero';
                } else {
                    let pagoBsCalculado = pagoMonto * tasa;
                    let cambioBs = pagoBsCalculado - totalBs;
                    if (cambioBs < 0) {
                        vueltoText = '⚠️ El pago en dólares es menor al total';
                    } else {
                        let cambioUSD = cambioBs / tasa;
                        vueltoText = `$${cambioUSD.toFixed(2)} (Equivale a Bs. ${cambioBs.toFixed(2)})`;
                    }
                }
            }

            document.getElementById('vueltoResultado').textContent = vueltoText;
        }
    </script>
</body>
</html>
